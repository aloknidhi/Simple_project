version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-brain-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.vite
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - CHOKIDAR_USEPOLLING=true
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      - backend
    network_mode: bridge
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-brain-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ai_user:secure_password@db:5432/personal_ai_brain
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BACKEND_PORT=8000
      - DEBUG=true
    volumes:
      - ./backend:/app
      - /app/__pycache__
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db
      - redis
    network_mode: bridge
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    container_name: ai-brain-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ai_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=personal_ai_brain
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/migrations:/migrations
    networks:
      - ai-brain-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-brain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-brain-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai-brain-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@ai-brain.local
      - PGADMIN_DEFAULT_PASSWORD=dev-password
    depends_on:
      - db
    networks:
      - ai-brain-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-brain-network:
    driver: bridge